# ============================================================
#  nginx reverse proxy (Tier 0 = darwaza)
#  Internet sirf is container tak aata hai (port 80)
# ============================================================
server {
    listen 80;
    server_name _;

    server_tokens off;              # nginx version chhupao
    client_max_body_size 1m;        # 1 MB se bari body na lo

    # Docker ka internal DNS (service names ko IP mein badalta hai)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- /api/  ->  backend container ----------
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ---------- baaki sab  ->  frontend container ----------
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- /metrics kabhi bahar na jaye ----------
    location = /metrics {
        return 404;
    }
}
