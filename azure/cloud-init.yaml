#cloud-config
# ============================================================
#  cloud-init: Azure VM pehli dafa boot hone par yeh sab khud karti hai
#  - Docker Engine + Compose plugin
#  - Java 21 + Jenkins
#  - /opt/cyberwing deploy folder
#  Log: /var/log/cloud-init-output.log
# ============================================================

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - unzip
  - jq
  - nano
  - fontconfig
  - openjdk-21-jre
  - openssl
  - mysql-client

write_files:
  # Docker daemon ki settings: log rotation (disk na bhare) + live-restore
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }

runcmd:
  # ---------- 1) Docker ka official repo ----------
  - |
    set -eux
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
    apt-get update
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    systemctl enable --now docker
    usermod -aG docker azureuser

  # ---------- 2) Jenkins ka official repo (stable) ----------
  - |
    set -eux
    curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key -o /usr/share/keyrings/jenkins-keyring.asc
    echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" > /etc/apt/sources.list.d/jenkins.list
    apt-get update
    apt-get install -y jenkins
    usermod -aG docker jenkins
    systemctl enable jenkins
    systemctl restart jenkins    # restart zaroori: docker group ka asar tab hota hai

  # ---------- 3) Deploy folder (Jenkins isme likhta hai) ----------
  - |
    set -eux
    mkdir -p /opt/cyberwing
    chown jenkins:docker /opt/cyberwing
    chmod 2775 /opt/cyberwing

  # ---------- 4) 2GB swap (safety: 8GB RAM + Jenkins + 8 containers) ----------
  - |
    set -eux
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
      echo 'vm.swappiness=10' > /etc/sysctl.d/99-swap.conf
    fi

  # ---------- 5) ho gaya ----------
  - touch /var/log/cyberwing-setup-done
